name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_LOG_PATH: ${{ github.workspace }}/.wrangler/check.log
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-site
