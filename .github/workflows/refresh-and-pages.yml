name: Refresh .au email data and publish Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
      timezone: Australia/Sydney
  workflow_dispatch:

permissions: {}

concurrency:
  group: au-mail-auth-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      au_count: ${{ steps.prepare.outputs.au_count }}
      shard_count: ${{ steps.prepare.outputs.shard_count }}
      list_id: ${{ steps.prepare.outputs.list_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install collector dependencies
        run: python -m pip install -r requirements.txt

      - name: Download Tranco and create the flat .au list
        id: prepare
        run: python -m collector.workflow prepare --output work/tranco-au.json --github-output "$GITHUB_OUTPUT"

      - name: Save scan input
        uses: actions/upload-artifact@v4
        with:
          name: tranco-au-input-${{ github.run_id }}
          path: work/tranco-au.json
          if-no-files-found: error

  scan:
    if: github.event_name != 'push'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: Scan flat shard ${{ matrix.shard }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install collector dependencies
        run: python -m pip install -r requirements.txt

      - name: Download the Tranco .au input list
        uses: actions/download-artifact@v5
        with:
          name: tranco-au-input-${{ github.run_id }}
          path: work

      - name: Scan flat shard ${{ matrix.shard }}
        run: >-
          python -m collector.workflow scan-shard
          --input work/tranco-au.json
          --shard ${{ matrix.shard }}
          --output work/shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}.jsonl.gz

      - name: Save completed shard result
        uses: actions/upload-artifact@v4
        with:
          name: au-shard-${{ github.run_id }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: work/shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}.jsonl.gz
          if-no-files-found: error

  merge-and-publish:
    if: github.event_name != 'push'
    needs: [prepare, scan]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install collector dependencies
        run: python -m pip install -r requirements.txt

      - name: Download Tranco input and completed shards
        uses: actions/download-artifact@v5
        with:
          pattern: au-shard-${{ github.run_id }}-*
          merge-multiple: true
          path: work/shards

      - name: Download scan manifest
        uses: actions/download-artifact@v5
        with:
          name: tranco-au-input-${{ github.run_id }}
          path: work/input

      - name: Validate and merge the complete scan
        run: python -m collector.workflow merge --input work/input/tranco-au.json --shards work/shards --output-dir site/data

      - name: Commit collected snapshot and raw archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/index.json site/data/snapshots site/data/raw
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh .au mail DNS snapshot"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-site:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
