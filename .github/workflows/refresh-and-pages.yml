name: Refresh .au email data and publish Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
      timezone: Australia/Sydney
  workflow_dispatch:

permissions: {}

concurrency:
  group: au-mail-auth-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}

      - name: Set up Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install collector dependencies
        if: github.event_name != 'push'
        run: python -m pip install -r requirements.txt

      - name: Collect the latest Tranco .au snapshot
        if: github.event_name != 'push'
        run: python -m collector.scan --output-dir site/data

      - name: Commit collected snapshot
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/index.json site/data/snapshots
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh .au mail DNS snapshot"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
